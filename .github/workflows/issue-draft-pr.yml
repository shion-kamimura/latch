name: Issue to Draft PR
run-name: 'Issue #${{ inputs.issue_number }} to Draft PR (attempt ${{ github.run_attempt }})'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open Issue number to implement
        required: true
        type: string

permissions: {}

concurrency:
  group: issue-draft-pr-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base: ${{ steps.issue.outputs.base }}
      source: ${{ steps.issue.outputs.source }}
      request_artifact: issue-request-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const {default: prepare} = await import(require('node:url').pathToFileURL(process.cwd() + '/.github/automation/prepare.mjs').href);
            await prepare({github, context, core});
      - uses: actions/upload-artifact@v4
        with:
          name: issue-request-${{ github.run_attempt }}
          path: request/issue.json
          retention-days: 1

  implement:
    needs: prepare
    outputs:
      candidate_ready: ${{ steps.proposal.outputs.ready }}
      candidate_attempt: ${{ steps.proposal.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: candidate-input
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.request_artifact }}
          path: ${{ runner.temp }}/request
      - name: Build pinned agent tools (no API key)
        run: docker build -f .github/automation/Dockerfile -t latch-agent .
      - name: Build trusted API gateway without secrets
        run: docker build -f .github/automation/Dockerfile.gateway -t latch-gateway .
      - name: Verify OpenCode startup without secrets or network
        run: docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,size=512m -e XDG_DATA_HOME=/tmp/xdg/data -e XDG_CONFIG_HOME=/tmp/xdg/config -e XDG_CACHE_HOME=/tmp/xdg/cache -e XDG_STATE_HOME=/tmp/xdg/state latch-agent opencode --version
      - name: Implement and save candidate in containers
        env:
          LATCH_IMPLEMENT_ONLY: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_PATH: ${{ github.workspace }}/candidate-input
          REQUEST_PATH: ${{ runner.temp }}/request/issue.json
          OUTPUT_PATH: ${{ runner.temp }}/proposal
        run: python3 .github/automation/run.py
      - name: Save safe execution measurements even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proposal/diagnostics.json
            ${{ runner.temp }}/proposal/policy.json
            ${{ runner.temp }}/proposal/stages/*.safe.json
            ${{ runner.temp }}/proposal/execution-summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Check safe proposal availability
        id: proposal
        if: always()
        env:
          PROPOSAL_PATH: ${{ runner.temp }}/proposal/candidate.json
        run: |
          if [ -f "$PROPOSAL_PATH" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.proposal.outputs.ready == 'true'
        with:
          name: issue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal/candidate.json
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: [prepare, implement]
    if: always() && needs.prepare.result == 'success' && needs.implement.outputs.candidate_ready == 'true'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/validate-candidate.yml
    with:
      control_base: ${{ needs.prepare.outputs.base }}
      origin_run_id: ${{ github.run_id }}
      origin_attempt: ${{ needs.implement.outputs.candidate_attempt }}
