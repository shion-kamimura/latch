name: Issue to Draft PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open Issue number to implement
        required: true
        type: string
      allow_maintenance:
        description: Deprecated compatibility input; repository changes can be proposed without this flag
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: issue-draft-pr-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base: ${{ steps.issue.outputs.base }}
      source: ${{ steps.issue.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ALLOW_MAINTENANCE: ${{ inputs.allow_maintenance }}
        with:
          script: |
            const {default: prepare} = await import(require('node:url').pathToFileURL(process.cwd() + '/.github/automation/prepare.mjs').href);
            await prepare({github, context, core});
      - uses: actions/upload-artifact@v4
        with:
          name: issue-request
          path: request/issue.json
          retention-days: 1

  implement:
    needs: prepare
    outputs:
      proposal_ready: ${{ steps.proposal.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: candidate-input
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-request
          path: ${{ runner.temp }}/request
      - name: Build pinned agent tools (no API key)
        run: docker build -f .github/automation/Dockerfile -t latch-agent .
      - name: Verify OpenCode startup without secrets or network
        run: docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,size=512m -e XDG_DATA_HOME=/tmp/xdg/data -e XDG_CONFIG_HOME=/tmp/xdg/config -e XDG_CACHE_HOME=/tmp/xdg/cache -e XDG_STATE_HOME=/tmp/xdg/state latch-agent opencode --version
      - name: Implement, repair, and independently verify in containers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_PATH: ${{ github.workspace }}/candidate-input
          REQUEST_PATH: ${{ runner.temp }}/request/issue.json
          OUTPUT_PATH: ${{ runner.temp }}/proposal
        run: python3 .github/automation/run.py
      - name: Save safe execution measurements even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-diagnostics
          path: |
            ${{ runner.temp }}/proposal/diagnostics.json
            ${{ runner.temp }}/proposal/policy.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check safe proposal availability
        id: proposal
        if: always()
        env:
          PROPOSAL_PATH: ${{ runner.temp }}/proposal/proposal.json
        run: |
          if [ -f "$PROPOSAL_PATH" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.proposal.outputs.ready == 'true'
        with:
          name: issue-proposal
          path: ${{ runner.temp }}/proposal/proposal.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, implement]
    if: always() && needs.prepare.result == 'success' && needs.implement.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-request
          path: ${{ runner.temp }}/request
      - uses: actions/download-artifact@v4
        with:
          name: issue-proposal
          path: ${{ runner.temp }}/proposal
      - name: Validate data and create Draft PR without running generated code
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ runner.temp }}/request/issue.json
          OUTPUT_PATH: ${{ runner.temp }}/proposal
        run: python3 .github/automation/publish.py
