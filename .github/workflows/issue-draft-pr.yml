name: Issue to Draft PR
run-name: 'Issue #${{ inputs.issue_number }} to Draft PR (attempt ${{ github.run_attempt }})'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open Issue number to implement
        required: true
        type: string

permissions: {}

concurrency:
  group: issue-draft-pr-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base: ${{ steps.issue.outputs.base }}
      source: ${{ steps.issue.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const {default: prepare} = await import(require('node:url').pathToFileURL(process.cwd() + '/.github/automation/prepare.mjs').href);
            await prepare({github, context, core});
      - uses: actions/upload-artifact@v4
        with:
          name: issue-request
          path: request/issue.json
          retention-days: 1

  implement:
    needs: prepare
    outputs:
      proposal_ready: ${{ steps.proposal.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: candidate-input
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-request
          path: ${{ runner.temp }}/request
      - name: Build pinned agent tools (no API key)
        run: |
          docker pull node:26.12.0-bookworm-slim
          docker build -f .github/automation/Dockerfile -t latch-agent .
      - name: Build trusted API gateway without secrets
        run: docker build -f .github/automation/Dockerfile.gateway -t latch-gateway .
      - name: Verify OpenCode startup without secrets or network
        run: docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,size=512m -e XDG_DATA_HOME=/tmp/xdg/data -e XDG_CONFIG_HOME=/tmp/xdg/config -e XDG_CACHE_HOME=/tmp/xdg/cache -e XDG_STATE_HOME=/tmp/xdg/state latch-agent opencode --version
      - name: Compute fixed-base store key (never candidate input)
        id: store-key
        continue-on-error: true
        run: python3 .github/automation/run.py --cache-key >> "$GITHUB_OUTPUT"
      - name: Restore exact fixed-base pnpm store
        id: store-cache
        if: steps.store-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base-pnpm-store
          key: ${{ steps.store-key.outputs.key }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      - name: Implement, repair, and independently verify in containers
        id: implement
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_PATH: ${{ github.workspace }}/candidate-input
          REQUEST_PATH: ${{ runner.temp }}/request/issue.json
          OUTPUT_PATH: ${{ runner.temp }}/proposal
          DEPENDENCY_STORE_PATH: ${{ runner.temp }}/base-pnpm-store
        run: python3 .github/automation/run.py
      - name: Save only fixed-base store; candidate stores are disposable
        if: always() && steps.store-key.outcome == 'success' && steps.implement.outputs.base_store_ready == 'true' && steps.store-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base-pnpm-store
          key: ${{ steps.store-key.outputs.key }}
      - name: Save safe execution measurements even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proposal/diagnostics.json
            ${{ runner.temp }}/proposal/policy.json
            ${{ runner.temp }}/proposal/stages/*.safe.json
            ${{ runner.temp }}/proposal/execution-summary.md
          if-no-files-found: warn
          retention-days: 14
      - name: Check safe proposal availability
        id: proposal
        if: always()
        env:
          PROPOSAL_PATH: ${{ runner.temp }}/proposal/proposal.json
        run: |
          if [ -f "$PROPOSAL_PATH" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.proposal.outputs.ready == 'true'
        with:
          name: issue-proposal
          path: ${{ runner.temp }}/proposal/proposal.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, implement]
    if: always() && needs.prepare.result == 'success' && needs.implement.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue-request
          path: ${{ runner.temp }}/request
      - uses: actions/download-artifact@v4
        with:
          name: issue-proposal
          path: ${{ runner.temp }}/proposal
      - name: Validate data and create Draft PR without running generated code
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ runner.temp }}/request/issue.json
          OUTPUT_PATH: ${{ runner.temp }}/proposal
        run: python3 .github/automation/publish.py
