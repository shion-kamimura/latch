name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Typecheck
            command: pnpm typecheck
          - name: Format
            command: pnpm format:check
          - name: Unit tests
            command: pnpm test:unit
          - name: Integration tests
            command: pnpm test:integration
          - name: Build
            command: pnpm build
          - name: CLI E2E
            command: pnpm test:e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check development environment
        run: node scripts/check-environment.ts
      - name: Build CLI for E2E
        if: matrix.name == 'CLI E2E'
        run: pnpm build
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
