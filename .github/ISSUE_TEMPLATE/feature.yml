name: 開発Issue
description: 機能・不具合・文書・保守の課題と受け入れ条件を定義する。タイトルは課題・期待動作を具体的に書き、種類はラベルで分類する。
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現状の問題、利用者、必要な背景を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待する動作
      description: 入力と出力、正常系・異常系の具体例を記載してください。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 実装スコープ
      description: 対象範囲と対象外を明記してください。
      value: |
        対象:
        -

        対象外:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受け入れ条件（Acceptance Criteria）
      description: テストなどで確認できる条件をチェックリストで記載してください。
      value: |
        - [ ]
    validations:
      required: true
